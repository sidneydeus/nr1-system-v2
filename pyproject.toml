[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nr1-agent"
version = "0.1.0"
description = "Agente NR-1 com chat em sessão para triagem inicial de riscos"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=0.2,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "groq>=0.37,<1.0",
  "pydantic>=2.8,<3.0",
  "langchain-community>=0.2.7,<1.0",
  "langchain-huggingface>=0.0.3,<1.0",
  "faiss-cpu>=1.8.0,<2.0",
  "sentence-transformers>=2.2,<3.0",
]

[project.scripts]
nr1-agent = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uvicorn]
factory = false
