[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nr1-agent"
version = "0.1.0"
description = "Agente NR-1 com chat em sessão para triagem inicial de riscos"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=0.2,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "groq>=0.37,<1.0",
  "pydantic>=2.8,<3.0",
  "langchain-community>=0.2.7,<1.0",
  "langchain-huggingface>=0.0.3,<1.0",
  "sentence-transformers>=2.2,<3.0",
  "httpx>=0.28,<1.0",
  "sqlite-utils>=3.37,<4.0",
  "sqlite-vec>=0.1.9,<1.0",
  "pypdf>=5.0,<6.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "opentelemetry-api>=1.25,<2.0",
  "opentelemetry-sdk>=1.25,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
  ]

[project.scripts]
nr1-agent = "nr1_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nr1_agent*"]

[tool.uvicorn]
factory = false
