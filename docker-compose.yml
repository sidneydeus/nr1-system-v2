services:
  sqlite:
    image: keinos/sqlite3:latest
    container_name: nr1-sqlite
    restart: unless-stopped
    user: "0:0"
    working_dir: /data
    command: ["sh", "-c", "mkdir -p /data && chmod 777 /data && touch /data/nr1.db && chmod 666 /data/nr1.db && tail -f /dev/null"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /data/nr1.db 'PRAGMA quick_check;' | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: nr1-chromadb
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: nr1-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-inspection:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: nr1-mcp-inspection
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nr1-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nr1-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SQLITE_DB_PATH=/data/nr1.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - MCP_INSPECTION_URL=http://mcp-inspection:8001
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      sqlite:
        condition: service_healthy
      mcp-inspection:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./data:/data