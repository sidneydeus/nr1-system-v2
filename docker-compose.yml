services:
  sqlite:
    image: keinos/sqlite3:latest
    container_name: nr1-sqlite
    restart: unless-stopped
    user: "0:0"
    working_dir: /data
    command: ["sh", "-c", "mkdir -p /data && chmod 777 /data && touch /data/nr1.db && chmod 666 /data/nr1.db && tail -f /dev/null"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /data/nr1.db 'PRAGMA quick_check;' | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: nr1-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - ./data:/data
      - n8n_data:/home/node/.n8n
    depends_on:
      sqlite:
        condition: service_healthy
      nr1-agent:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: nr1-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  mcp-inspection:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: nr1-mcp-inspection
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nr1-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nr1-agent
    restart: unless-stopped
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - SQLITE_DB_PATH=/data/nr1.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - MCP_INSPECTION_URL=http://mcp-inspection:8001
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      sqlite:
        condition: service_healthy
      mcp-inspection:
        condition: service_healthy
      jaeger:
        condition: service_started

    volumes:
      - ./data:/data

volumes:
  n8n_data:
