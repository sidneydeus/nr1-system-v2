services:
  sqlite:
    image: keinos/sqlite3:latest
    container_name: nr1-sqlite
    restart: unless-stopped
    user: "0:0"
    working_dir: /data
    command: ["sh", "-c", "mkdir -p /data && chmod 777 /data && touch /data/nr1.db && chmod 666 /data/nr1.db && tail -f /dev/null"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "sqlite3 /data/nr1.db 'PRAGMA quick_check;' | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-inspection:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: nr1-mcp-inspection
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nr1-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nr1-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SQLITE_DB_PATH=/data/nr1.db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - MCP_INSPECTION_URL=http://mcp-inspection:8001
    depends_on:
      sqlite:
        condition: service_healthy
      mcp-inspection:
        condition: service_healthy
    volumes:
      - ./data:/data